<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CHanGe · Nick Haywood</title>
  <meta name="description" content="On-call access to the CHanGe framework: Habits, Behaviours, Culture, Results." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg?v=4" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="CHanGe" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <script>
    // Surface any script error on the page instead of failing to a blank screen.
    window.addEventListener("error", function (e) {
      var box = document.getElementById("diag");
      if (!box) {
        box = document.createElement("pre");
        box.id = "diag";
        box.style.cssText =
          "white-space:pre-wrap;color:#ff6b00;background:#1c1c20;border:1px solid #ff6b00;" +
          "border-radius:12px;margin:20px;padding:16px;font:13px/1.5 ui-monospace,monospace;max-width:880px;";
        (document.body || document.documentElement).appendChild(box);
      }
      var where = e.filename ? "  @ " + e.filename.split("/").pop() + ":" + e.lineno : "";
      box.textContent += (e.message || String(e.error) || "Script error") + where + "\n";
    });
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="icons/favicon.svg?v=4" alt="CHanGe logo" width="48" height="48" />
      <div class="brand-text">
        <h1>CHanGe</h1>
        <p class="owner">Nick Haywood</p>
      </div>
    </div>
    <p class="equation" id="equation"></p>
  </header>

  <nav class="pillar-nav" id="pillarNav" aria-label="Pillars"></nav>

  <main id="app"></main>

  <footer class="app-footer">
    <p>The CHanGe operating system · on-call reference</p>
  </footer>

  <script src="documents.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
